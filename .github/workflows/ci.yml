name: Cars Dealership CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies and pylint
        run: pip install -r server/requirements.txt pylint pylint-django
      - name: Lint Python files with pylint
        working-directory: server
        run: pylint --exit-zero --load-plugins pylint_django --django-settings-module=djangoproj.settings djangoapp djangoproj

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: server/frontend
        run: npm install --legacy-peer-deps
      - name: Lint JavaScript files with ESLint
        working-directory: server/frontend
        run: npx eslint src --ext .js,.jsx

  django-tests:
    name: Django Tests
    needs: [lint-python, lint-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Validate Django configuration
        working-directory: server
        run: python manage.py check
      - name: Apply migrations
        working-directory: server
        run: python manage.py migrate --noinput
      - name: Run tests
        working-directory: server
        run: python manage.py test
